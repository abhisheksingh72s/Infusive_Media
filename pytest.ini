[pytest]
pythonpath = .
testpaths = tests
addopts = --browser chromium --headed --html=reports/report.html --self-contained-html
log_cli = true
log_cli_level = INFO
log_file = logs/test_run.log
log_file_level = DEBUG
markers =
    login_as(email): log in through the UI with the matching email/password from .env
