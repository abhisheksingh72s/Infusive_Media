[pytest]
pythonpath = .
testpaths = tests
addopts = --browser chromium --headed --tracing on --html=reports/report.html --self-contained-html -v
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/framework.log
log_file_level = DEBUG
console_output_style = classic
markers =
    login_as(email): log in through the UI with the matching email/password from .env
    ui: mark test as UI automation test
    api: mark test as API automation test
    regression: mark test as regression test
    sanity: mark test as sanity test suite
    smoke: mark test as smoke test suite
