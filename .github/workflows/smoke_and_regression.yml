name: Smoke Gatekeeper & Auto PR Merge Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ===========================================================================
  # STEP 1: CREATE PULL REQUEST (For Feature Branches)
  # ===========================================================================
  create-pull-request:
    name: "Step 1: Automatically Create Pull Request to Main"
    if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Check and Create PR if Not Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Checking for existing PR for branch: $BRANCH_NAME"
          
          EXISTS=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq 'length')
          if [ "$EXISTS" -eq "0" ]; then
            echo "Creating Pull Request from $BRANCH_NAME to main..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Automated PR: $BRANCH_NAME" \
              --body "Automated PR created for branch \`$BRANCH_NAME\`. Smoke tests (Login & Dashboard Matrix) will execute as PR status checks."
          else
            echo "Pull Request already exists for branch $BRANCH_NAME."
          fi

  # ===========================================================================
  # STEP 2: RUN SMOKE TEST SUITE (Login & Dashboard API/UI Matrix)
  # ===========================================================================
  smoke-testing:
    name: "Step 2: Execute Smoke Tests (Login & Dashboard Validation)"
    needs: [create-pull-request]
    if: always() && (needs.create-pull-request.result == 'success' || needs.create-pull-request.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Generate .env File from GitHub Secrets
        env:
          ENV_SECRET: ${{ secrets.ENV }}
          SECRET_EMAIL: ${{ secrets.EMAIL }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
          SECRET_BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            printf "%s\n" "$ENV_SECRET" > .env
            echo "Successfully generated .env from secrets.ENV."
          elif [ -n "$SECRET_EMAIL" ] && [ -n "$SECRET_PASSWORD" ]; then
            echo "Generating .env from individual secrets (EMAIL, PASSWORD)..."
            cat << EOF > .env
          BASE_URL=${SECRET_BASE_URL:-https://infusive-front.jobvritta.com/login}
          BASE_API_URL=https://infusive-back.jobvritta.com/api/
          BASE_API_URL_STG=https://infusive-back.jobvritta.com/api/
          BASE_API_URL_PROD=https://crmapi.infusivemedia.com/api/
          EMAIL=$SECRET_EMAIL
          PASSWORD=$SECRET_PASSWORD
          EOF
          else
            echo "No custom secrets detected. Using default STAGE environment configuration..."
            cat << 'EOF' > .env
          BASE_URL=https://infusive-front.jobvritta.com/login
          BASE_API_URL=https://infusive-back.jobvritta.com/api/
          BASE_API_URL_STG=https://infusive-back.jobvritta.com/api/
          BASE_API_URL_PROD=https://crmapi.infusivemedia.com/api/
          EMAIL=Admin@infusive.com
          PASSWORD=123456
          EOF
          fi

      - name: Execute Smoke Test Suite (-m smoke)
        run: |
          xvfb-run pytest -m smoke -v --html=reports/smoke_report.html --self-contained-html

      - name: Upload Test Report & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-execution-reports
          path: |
            reports/
            screenshots/
            logs/
          retention-days: 7

  # ===========================================================================
  # STEP 3: AUTOMATICALLY MERGE PR TO MAIN
  # (Executes ONLY IF Step 2 Smoke Testing PASSED and is Feature Branch)
  # ===========================================================================
  auto-merge-pr:
    name: "Step 3: Auto-Merge PR into Main (Only if Smoke Tests Pass)"
    needs: [smoke-testing]
    if: github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Merge PR into Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Smoke tests PASSED! Automatically merging PR for branch $BRANCH_NAME into main..."
          gh pr merge "$BRANCH_NAME" --merge --delete-branch || gh pr merge "$BRANCH_NAME" --merge
          echo "Successfully merged $BRANCH_NAME into main!"
